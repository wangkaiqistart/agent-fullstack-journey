<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">Chat 与 Responses 的工具调用闭环</title>
<desc id="desc">依据项目两个真实模型工具示例绘制。同一订单问题分别以 user 消息和 input 传入；第一次模型调用返回工具请求，程序校验并执行本地模拟工具，以各自关联字段回传结果；第二次模型调用给出最终文本。</desc>
<rect width="960" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657c"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#183153">工具闭环：两次模型调用，中间由程序执行工具</text>
<text x="240" y="78" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#183153">Chat Completions</text>
<rect x="25" y="95" width="430" height="525" rx="16" fill="#fafbfd" stroke="#dce3ec"/>
<rect x="40" y="115" width="400" height="70" rx="12" fill="#eaf2ff" stroke="#c8d5e5"/>
<rect x="40" y="225" width="400" height="95" rx="12" fill="#eaf2ff" stroke="#c8d5e5"/>
<rect x="40" y="365" width="400" height="110" rx="12" fill="#fff1e8" stroke="#c8d5e5"/>
<rect x="40" y="520" width="400" height="75" rx="12" fill="#e9f7ee" stroke="#c8d5e5"/>
<path d="M240 185V225" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M240 320V365" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M240 475V520" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="240" y="145" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="700" fill="#183153">user 消息</text>
<text x="240" y="172" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#183153">查询 ORD-DEMO-001</text>
<text x="240" y="253" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">第1次模型调用：请求工具</text>
<text x="240" y="283" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#183153">assistant.tool_calls</text>
<text x="240" y="307" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#52657c">finish_reason = tool_calls</text>
<text x="240" y="395" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">本地校验、执行订单工具</text>
<text x="240" y="426" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#183153">role=tool</text>
<text x="240" y="457" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#87431e">tool_call_id = call.id</text>
<text x="240" y="550" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">第2次模型调用：最终回答</text>
<text x="240" y="579" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#183153">assistant 文本 / stop</text>
<text x="720" y="78" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#183153">Responses</text>
<rect x="505" y="95" width="430" height="525" rx="16" fill="#fafbfd" stroke="#dce3ec"/>
<rect x="520" y="115" width="400" height="70" rx="12" fill="#eaf2ff" stroke="#c8d5e5"/>
<rect x="520" y="225" width="400" height="95" rx="12" fill="#eaf2ff" stroke="#c8d5e5"/>
<rect x="520" y="365" width="400" height="110" rx="12" fill="#fff1e8" stroke="#c8d5e5"/>
<rect x="520" y="520" width="400" height="75" rx="12" fill="#e9f7ee" stroke="#c8d5e5"/>
<path d="M720 185V225" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M720 320V365" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M720 475V520" fill="none" stroke="#52657c" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="720" y="145" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="700" fill="#183153">用户 input</text>
<text x="720" y="172" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#183153">查询 ORD-DEMO-001</text>
<text x="720" y="253" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">第1次模型调用：请求工具</text>
<text x="720" y="283" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#183153">output: function_call</text>
<text x="720" y="307" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" fill="#52657c">status = completed</text>
<text x="720" y="395" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">本地校验、执行订单工具</text>
<text x="720" y="426" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" fill="#183153">function_call_output</text>
<text x="720" y="457" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#87431e">call_id = call.call_id</text>
<text x="720" y="550" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="700" fill="#183153">第2次模型调用：最终回答</text>
<text x="720" y="579" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#183153">output: message / completed</text>
<text x="480" y="650" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" fill="#52657c">关联字段不同；模型提出调用请求，程序负责校验与执行。</text>
</svg>
